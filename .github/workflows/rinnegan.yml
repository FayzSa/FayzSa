name: Rinnegan

on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths:
      - ".github/scripts/forge_stats.py"
      - ".github/workflows/rinnegan.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rinnegan
  cancel-in-progress: true

jobs:
  forge:
    name: Forge stat cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render stat cards
        env:
          # Optional: set a STATS_TOKEN secret (a PAT with read:user + repo)
          # to include private repositories. Falls back to the built-in token,
          # which sees public activity only.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          STATS_USER: ${{ github.repository_owner }}
        run: python .github/scripts/forge_stats.py

      - name: Commit refreshed cards
        run: |
          if git diff --quiet -- assets; then
            echo "No change in stat cards."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg
          git commit -m "chore: refresh Rinnegan stat cards"
          git push
